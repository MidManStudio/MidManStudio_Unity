# .github/workflows/build-audio-libs.yml
#
# Builds mid_audio native DSP library for all supported Unity platforms.
# Mirrors build-rust-libs.yml exactly — same pattern, different crate.
#
# NOTE: no cargo/target caching on this crate. mid_audio is ~150 lines,
# zero dependencies, and compiles in under 10s per target even with
# lto=true + codegen-units=1. A previous version of this workflow cached
# `target/` keyed only on Cargo.toml — which meant a `restore-keys` prefix
# fallback could silently restore a build of an OLD version of this crate
# (from before the v1 PCM-bank -> v2 limiter-only rewrite) whenever the
# exact cache key missed. That produced 300KB+ "stale" .so files on
# arm64-v8a/x86_64 that looked fine (correct symbol names, plausible size)
# but were running old code. Not worth the risk for a build this fast —
# just build clean every time.
#
# ── Platform support ──────────────────────────────────────────────────────────
#   macOS    : universal x86_64 + arm64 dylib  (lipo merged)
#   Windows  : x64 DLL via MinGW cross-compile
#   Linux    : x64 .so  (Editor-compat OFF — CI-only, avoids dlclose/TLS segfault on Unity quit)
#   Android  : arm64-v8a, armeabi-v7a, x86_64  (via cargo-ndk), symbol-validated
#   iOS      : device arm64 .a  +  simulator fat .a  (arm64-sim + x86_64)
#   WebGL    : NOT SUPPORTED — Unity WebGL uses the Web Audio API; there is
#              no OnAudioFilterRead native callback path available. Skip.
#
# Outputs (committed to utilities package after successful build):
#   packages/com.midmanstudio.utilities/Runtime/Plugins/Native/Audio/
#   ├── macOS/libmid_audio.dylib
#   ├── Windows/mid_audio.dll
#   ├── Linux/libmid_audio.so
#   ├── Android/{arm64-v8a,armeabi-v7a,x86_64}/libmid_audio.so
#   ├── iOS/libmid_audio.a          (device)
#   └── iOS/libmid_audio_sim.a      (simulator fat binary)

name: Build mid_audio Native Libs

on:
  push:
    branches: [master]
    paths:
      - 'rust_lib/mid_audio/**'
  workflow_dispatch:

jobs:

  # ── macOS (universal x86_64 + arm64) ──────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - name: Build universal dylib
        working-directory: rust_lib/mid_audio
        run: |
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          lipo -create \
            target/x86_64-apple-darwin/release/libmid_audio.dylib \
            target/aarch64-apple-darwin/release/libmid_audio.dylib \
            -output libmid_audio.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: audio-macos
          path: rust_lib/mid_audio/libmid_audio.dylib
          retention-days: 1

  # ── Windows x64 ───────────────────────────────────────────────────────────
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - run: sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Configure MinGW linker
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml << 'EOF'
          [target.x86_64-pc-windows-gnu]
          linker = "x86_64-w64-mingw32-gcc"
          EOF
      - name: Build
        working-directory: rust_lib/mid_audio
        run: cargo build --release --target x86_64-pc-windows-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: audio-windows
          path: rust_lib/mid_audio/target/x86_64-pc-windows-gnu/release/mid_audio.dll
          retention-days: 1

  # ── Linux x64 ─────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - working-directory: rust_lib/mid_audio
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: audio-linux
          path: rust_lib/mid_audio/target/release/libmid_audio.so
          retention-days: 1

  # ── Android (arm64, armv7, x86_64) ────────────────────────────────────────
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - run: cargo install cargo-ndk --version "^3" --locked
      - name: Locate NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_ROOT:-}}"
          [ -z "$NDK" ] && NDK=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -1)
          [ -z "$NDK" ] && { echo "❌ Android NDK not found on runner"; exit 1; }
          echo "ANDROID_NDK_HOME=$NDK" >> $GITHUB_ENV
          echo "Using NDK: $NDK"
      - name: Build all ABIs (clean, no cache)
        working-directory: rust_lib/mid_audio
        run: |
          set -e
          cargo ndk -t arm64-v8a   -o ./android-out build --release
          cargo ndk -t armeabi-v7a -o ./android-out build --release
          cargo ndk -t x86_64      -o ./android-out build --release
      - name: Verify ABI outputs (symbol-set consistency, not raw size)
        working-directory: rust_lib/mid_audio
        run: |
          set -e
          MIN_BYTES=500   # only catches literal zero/truncated files, not "small but correct"
          EXPECTED_SYMS="process_buffer set_limiter_params set_limiter_enabled reset_limiter get_limiter_gain get_limiter_threshold mid_audio_version"
          FAIL=0
          declare -A SYMSETS

          for ABI in arm64-v8a armeabi-v7a x86_64; do
            F="android-out/$ABI/libmid_audio.so"
            if [ ! -f "$F" ]; then
              echo "❌ MISSING: $ABI — libmid_audio.so was not produced"
              FAIL=1; continue
            fi
            SIZE=$(stat -c%s "$F")
            echo "  $ABI: ${SIZE} bytes"
            if [ "$SIZE" -lt "$MIN_BYTES" ]; then
              echo "❌ TRUNCATED/EMPTY: $ABI ($SIZE bytes)"
              FAIL=1; continue
            fi

            DEFINED=$(nm -D --defined-only "$F" 2>/dev/null | awk '{print $3}' | sort)
            SYMSETS[$ABI]="$DEFINED"

            for SYM in $EXPECTED_SYMS; do
              echo "$DEFINED" | grep -qx "$SYM" || { echo "❌ $ABI missing exported symbol: $SYM"; FAIL=1; }
            done
          done

          # All three ABIs must export the exact same set of functions —
          # this is what actually distinguishes "small but correct" from "stub".
          if [ -n "${SYMSETS[arm64-v8a]:-}" ] && [ -n "${SYMSETS[armeabi-v7a]:-}" ]; then
            [ "${SYMSETS[arm64-v8a]}" = "${SYMSETS[armeabi-v7a]}" ] || { echo "❌ arm64-v8a/armeabi-v7a export different symbol sets"; FAIL=1; }
          fi
          if [ -n "${SYMSETS[arm64-v8a]:-}" ] && [ -n "${SYMSETS[x86_64]:-}" ]; then
            [ "${SYMSETS[arm64-v8a]}" = "${SYMSETS[x86_64]}" ] || { echo "❌ arm64-v8a/x86_64 export different symbol sets"; FAIL=1; }
          fi

          [ "$FAIL" = "1" ] && { echo "❌ Android artifact verification failed."; exit 1; }
          echo "✅ All 3 ABIs present, export the identical expected symbol set. (Sizes may legitimately differ per-target and that's fine.)"
      - uses: actions/upload-artifact@v4
        with:
          name: audio-android
          path: rust_lib/mid_audio/android-out/
          retention-days: 1

  # ── iOS (device + simulator) ───────────────────────────────────────────────
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - working-directory: rust_lib/mid_audio
        run: |
          cargo build --release --target aarch64-apple-ios
          cargo build --release --target aarch64-apple-ios-sim
          cargo build --release --target x86_64-apple-ios
          lipo -create \
            target/aarch64-apple-ios-sim/release/libmid_audio.a \
            target/x86_64-apple-ios/release/libmid_audio.a \
            -output libmid_audio_sim.a
      - uses: actions/upload-artifact@v4
        with:
          name: audio-ios-device
          path: rust_lib/mid_audio/target/aarch64-apple-ios/release/libmid_audio.a
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: audio-ios-sim
          path: rust_lib/mid_audio/libmid_audio_sim.a
          retention-days: 1

  # ── Commit all built libs into the utilities package ───────────────────────
  commit-to-repo:
    needs: [build-macos, build-windows, build-linux, build-android, build-ios]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with: { name: audio-macos, path: dl/macos }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: audio-windows, path: dl/windows }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: audio-linux, path: dl/linux }
        continue-on-error: true

      - uses: actions/download-artifact@v4
        with: { name: audio-android, path: dl/android }

      - uses: actions/download-artifact@v4
        with: { name: audio-ios-device, path: dl/ios-device }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: audio-ios-sim, path: dl/ios-sim }
        continue-on-error: true

      - name: Copy libs into utilities package + generate/validate .meta
        run: |
          set -e
          PLUG=packages/com.midmanstudio.utilities/Runtime/Plugins/Native/Audio
          CORRUPT=0

          copy_if() {
            [ -f "$1" ] && { mkdir -p "$(dirname "$2")"; cp "$1" "$2"; echo "copied $2"; } || echo "missing: $1"
          }

          gen_guid() { python3 -c "import uuid; print(uuid.uuid4().hex)"; }

          fail_on_corruption() {
            local f="$1"
            [ -f "$f" ] || return 0
            if grep -q "^      : Any" "$f"; then
              echo "❌ CORRUPTED META (duplicate legacy platformData block): $f"
              echo "   Known Unity duplicate-key import crash. Fix by hand — CI will not overwrite it for you."
              CORRUPT=1
            fi
          }

          write_desktop_meta() {
            local so="$1" os="$2" editor_on="$3" meta="${1}.meta"
            fail_on_corruption "$meta"
            [ -f "$meta" ] && return 0
            [ -f "$so" ] || return 0
            local guid; guid=$(gen_guid)
            cat > "$meta" <<EOF
          fileFormatVersion: 2
          guid: $guid
          PluginImporter:
            externalObjects: {}
            serializedVersion: 2
            iconMap: {}
            executionOrder: {}
            defineConstraints: []
            isPreloaded: 0
            isOverridable: 1
            isExplicitlyReferenced: 0
            validateReferences: 1
            platformData:
            - first:
                Any: 
              second:
                enabled: 0
                settings: {}
            - first:
                Editor: Editor
              second:
                enabled: $editor_on
                settings:
                  DefaultValueInitialized: true
            - first:
                Standalone: $os
              second:
                enabled: 1
                settings:
                  CPU: AnyCPU
            userData: 
            assetBundleName: 
            assetBundleVariant: 
          EOF
            echo "generated $meta"
          }

          write_android_meta() {
            local so="$1" cpu="$2" meta="${1}.meta"
            fail_on_corruption "$meta"
            [ -f "$meta" ] && return 0
            [ -f "$so" ] || return 0
            local guid; guid=$(gen_guid)
            cat > "$meta" <<EOF
          fileFormatVersion: 2
          guid: $guid
          PluginImporter:
            externalObjects: {}
            serializedVersion: 2
            iconMap: {}
            executionOrder: {}
            defineConstraints: []
            isPreloaded: 0
            isOverridable: 1
            isExplicitlyReferenced: 0
            validateReferences: 1
            platformData:
            - first:
                Any: 
              second:
                enabled: 0
                settings: {}
            - first:
                Editor: Editor
              second:
                enabled: 0
                settings:
                  DefaultValueInitialized: true
            - first:
                Android: Android
              second:
                enabled: 1
                settings:
                  CPU: $cpu
            userData: 
            assetBundleName: 
            assetBundleVariant: 
          EOF
            echo "generated $meta"
          }

          write_simple_meta() {
            local so="$1" platform="$2" meta="${1}.meta"
            fail_on_corruption "$meta"
            [ -f "$meta" ] && return 0
            [ -f "$so" ] || return 0
            local guid; guid=$(gen_guid)
            cat > "$meta" <<EOF
          fileFormatVersion: 2
          guid: $guid
          PluginImporter:
            externalObjects: {}
            serializedVersion: 2
            iconMap: {}
            executionOrder: {}
            defineConstraints: []
            isPreloaded: 0
            isOverridable: 1
            isExplicitlyReferenced: 0
            validateReferences: 1
            platformData:
            - first:
                Any: 
              second:
                enabled: 0
                settings: {}
            - first:
                Editor: Editor
              second:
                enabled: 0
                settings:
                  DefaultValueInitialized: true
            - first:
                $platform: $platform
              second:
                enabled: 1
                settings: {}
            userData: 
            assetBundleName: 
            assetBundleVariant: 
          EOF
            echo "generated $meta"
          }

          find "$PLUG" -name "*.meta" 2>/dev/null | while read -r f; do fail_on_corruption "$f"; done

          copy_if dl/macos/libmid_audio.dylib "$PLUG/macOS/libmid_audio.dylib"
          write_desktop_meta "$PLUG/macOS/libmid_audio.dylib" OSXUniversal 1

          copy_if dl/windows/mid_audio.dll "$PLUG/Windows/mid_audio.dll"
          write_desktop_meta "$PLUG/Windows/mid_audio.dll" Win64 1

          copy_if dl/linux/libmid_audio.so "$PLUG/Linux/libmid_audio.so"
          write_desktop_meta "$PLUG/Linux/libmid_audio.so" Linux64 0

          declare -A CPUMAP=( [arm64-v8a]=ARM64 [armeabi-v7a]=ARMv7 [x86_64]=X86_64 )
          MISSING_REQUIRED=0
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            SRC="dl/android/$ABI/libmid_audio.so"
            DST="$PLUG/Android/$ABI/libmid_audio.so"
            if [ ! -f "$SRC" ]; then
              echo "❌ REQUIRED Android ABI missing: $ABI"
              [ "$ABI" = "arm64-v8a" ] && MISSING_REQUIRED=1
              continue
            fi
            copy_if "$SRC" "$DST"
            write_android_meta "$DST" "${CPUMAP[$ABI]}"
          done
          [ "$MISSING_REQUIRED" = "1" ] && { echo "❌ arm64-v8a build missing — this breaks modern Android devices (A13 included). Failing."; exit 1; }

          copy_if dl/ios-device/libmid_audio.a "$PLUG/iOS/libmid_audio.a"
          write_simple_meta "$PLUG/iOS/libmid_audio.a" iOS
          copy_if dl/ios-sim/libmid_audio_sim.a "$PLUG/iOS/libmid_audio_sim.a"
          write_simple_meta "$PLUG/iOS/libmid_audio_sim.a" iOS

          [ "$CORRUPT" = "1" ] && { echo "❌ One or more existing .meta files are corrupted — see above. Fix by hand before this can pass."; exit 1; }
          echo "✅ Copy + meta generation complete."

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/com.midmanstudio.utilities/Runtime/Plugins/Native/Audio/
          git diff --staged --quiet && echo "no changes" || \
            git commit -m "ci: rebuild mid_audio native libs [skip ci]"
          git push
