name: Release Packages
on:
  push:
    tags:
      - 'utilities/v*'
      - 'netcode/v*'
      - 'projectilesystem/v*'
      - 'patterns/v*'
      - 'audio/v*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to release (tag is created as <package>/v<version from package.json>)'
        required: true
        type: choice
        options:
          - utilities
          - netcode
          - projectilesystem
          - patterns
          - audio
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine package, version and tag
        id: pkg
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_PACKAGE: ${{ github.event.inputs.package }}
        run: |
          set -euo pipefail

          # A pushed tag names its package before the first slash. A manual run
          # takes the package from the input, because github.ref_name is then a
          # branch name and says nothing about the package.
          if [[ "$REF_TYPE" == "tag" ]]; then
            SHORT="${REF_NAME%%/*}"
          else
            SHORT="$INPUT_PACKAGE"
          fi

          case "$SHORT" in
            utilities|netcode|projectilesystem|patterns|audio) ;;
            *)
              echo "::error::Unknown package '$SHORT' (ref type '$REF_TYPE', ref '$REF_NAME')"
              exit 1
              ;;
          esac

          NAME="com.midmanstudio.$SHORT"
          PKG_PATH="packages/$NAME"
          if [[ ! -f "$PKG_PATH/package.json" ]]; then
            echo "::error::$PKG_PATH/package.json not found at this commit"
            exit 1
          fi

          VERSION="$(jq -r '.version // empty' "$PKG_PATH/package.json")"
          if [[ -z "$VERSION" ]]; then
            echo "::error::No version in $PKG_PATH/package.json"
            exit 1
          fi

          TAG="$SHORT/v$VERSION"
          if [[ "$REF_TYPE" == "tag" && "$REF_NAME" != "$TAG" ]]; then
            echo "::error::Tag '$REF_NAME' does not match package.json version. Expected '$TAG'."
            exit 1
          fi

          {
            echo "short=$SHORT"
            echo "name=$NAME"
            echo "path=$PKG_PATH"
            echo "version=$VERSION"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Extract release notes
        env:
          PKG_PATH: ${{ steps.pkg.outputs.path }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          set -euo pipefail

          # Notes are the "## <version>" section of the package CHANGELOG.md,
          # up to the next "## " heading.
          awk -v v="$VERSION" '
            /^## / {
              if (found) exit
              if ($2 == v) { found = 1; next }
            }
            found { print }
          ' "$PKG_PATH/CHANGELOG.md" > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            echo "::warning::$PKG_PATH/CHANGELOG.md has no '## $VERSION' section. Using the whole file."
            cp "$PKG_PATH/CHANGELOG.md" release-notes.md
          fi

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "${{ steps.pkg.outputs.name }} ${{ steps.pkg.outputs.tag }}"
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
