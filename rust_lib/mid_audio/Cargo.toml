[package]
name = "mid_audio"
version = "0.2.0"
edition = "2021"

[lib]
name = "mid_audio"
crate-type = ["cdylib", "staticlib", "rlib"]

# v2: limiter-only — no OnceLock, no Mutex, no lazy_static needed.
# All shared state uses atomics. The crate has zero dependencies.

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name    = "audio_bench"
harness = false

[profile.release]
opt-level      = 3
lto            = true
codegen-units  = 1
panic          = "abort"

[profile.release-wasm]
inherits      = "release"
opt-level     = "s"
lto           = true
codegen-units = 1
panic         = "abort"
